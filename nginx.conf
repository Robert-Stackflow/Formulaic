server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 依次尝试访问：
        # 1. 直接匹配的文件（如 /assets/logo.png）
        # 2. 对应的目录（如 /blog/ → /blog/index.html）
        # 3. 加上 .html 后缀的文件（如 /about → /about.html）
        # 4. 最后回退到 /index.html（用于 SPA 路由）
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 可选：自定义错误页
    error_page 404 /index.html;
}
