name: Build and deploy Formulaic

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formulaic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
      NEXTAUTH_URL: https://formulaic.cloudchewie.com
      NEXT_PUBLIC_ONESEARCH_SERVER_URL: ${{ vars.ONESEARCH_SERVER_URL }}
      NEXT_PUBLIC_ONESEARCH_APP_ID: ${{ vars.ONESEARCH_APP_ID }}
      NEXT_PUBLIC_ONESEARCH_SEARCH_KEY: ${{ vars.ONESEARCH_SEARCH_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Vercel CLI
        if: github.event_name != 'pull_request'
        run: npm install --global vercel@62.2.0
      - name: Configure OneSearch in Vercel
        if: github.event_name != 'pull_request'
        run: node scripts/configure-vercel-search.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Pull production environment
        if: github.event_name != 'pull_request'
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build with memory metrics
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            /usr/bin/time -v npm run build
          else
            /usr/bin/time -v vercel build --prod --token "$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npm run typecheck
      - run: npm run sync:onesearch -- --dry-run
      - name: Publish OneSearch index
        if: github.event_name != 'pull_request'
        run: npm run sync:onesearch
        env:
          ONESEARCH_SERVER_URL: ${{ vars.ONESEARCH_SERVER_URL }}
          ONESEARCH_APP_ID: ${{ vars.ONESEARCH_APP_ID }}
          ONESEARCH_PUBLISH_KEY: ${{ secrets.ONESEARCH_PUBLISH_KEY }}
      - name: Deploy production build
        if: github.event_name != 'pull_request'
        run: vercel deploy --prebuilt --archive=tgz --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
